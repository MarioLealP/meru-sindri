# What the runner needs to run jobs as pods in this namespace (gitea/runner docs/kubernetes.md) - nothing else, and
# nowhere else. It can't read Secrets, only create and delete the per-job ones it makes.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sindri
  namespace: {{ include "sindri-build.namespace" . }}
  labels:
    {{- include "sindri-build.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sindri
  namespace: {{ include "sindri-build.namespace" . }}
  labels:
    {{- include "sindri-build.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, get, list, delete]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create, get]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sindri
  namespace: {{ include "sindri-build.namespace" . }}
  labels:
    {{- include "sindri-build.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sindri
subjects:
  - kind: ServiceAccount
    name: sindri
    namespace: {{ include "sindri-build.namespace" . }}
---
# The identity of `sindri` jobs towards OpenBao (role meru-<app>-build). No Kubernetes permissions at all.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: signer
  namespace: {{ include "sindri-build.namespace" . }}
  labels:
    {{- include "sindri-build.labels" . | nindent 4 }}
automountServiceAccountToken: false
