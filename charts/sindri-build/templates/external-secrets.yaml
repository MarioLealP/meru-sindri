{{- /*
The runner's registration token from OpenBao (D66): ESO logs in as this namespace's `eso` account through the
shared role meru-eso (D71: OpenBao fills in the namespace from the login, so it reads apps/meru/<app>-build/eso/*
only) and writes `sindri-registration`, owning it (D68). Store at wave -2 so it's validated before the ExternalSecret asks (-1); the runner (0) waits for both.
*/}}
# The identity ESO borrows to log in to OpenBao. No pod runs as it; no API token mounted.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso
  namespace: {{ include "sindri-build.namespace" . }}
  labels:
    {{- include "sindri-build.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao
  namespace: {{ include "sindri-build.namespace" . }}
  labels:
    {{- include "sindri-build.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  provider:
    vault:
      server: {{ .Values.openbao.addr }}
      path: apps
      version: v2
      caBundle: {{ .Values.openbao.caCert | b64enc }}
      auth:
        kubernetes:
          mountPath: kubernetes
          role: meru-eso
          serviceAccountRef:
            name: eso
            audiences: [openbao]
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sindri-registration
  namespace: {{ include "sindri-build.namespace" . }}
  labels:
    {{- include "sindri-build.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: {{ .Values.openbao.refreshInterval }}
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: sindri-registration
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: meru/{{ include "sindri-build.namespace" . }}/eso/sindri-registration
