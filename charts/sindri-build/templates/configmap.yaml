# gitea/runner config (example: internal/pkg/config/config.example.yaml of the pinned release).
apiVersion: v1
kind: ConfigMap
metadata:
  name: sindri-config
  namespace: {{ include "sindri-build.namespace" . }}
  labels:
    {{- include "sindri-build.labels" . | nindent 4 }}
data:
  entrypoint.sh: |
    {{- .Files.Get "files/entrypoint.sh" | nindent 4 }}
  config.yaml: |
    log:
      level: info
    runner:
      file: /data/.runner
      capacity: 1 # one job at a time
      timeout: {{ .Values.runner.timeout }}
    cache:
      enabled: false # actions/cache server; our jobs don't use it (and it wanted a writable /.cache)
    metrics:
      enabled: true
      addr: ":9101" # /healthz + /readyz for the probes; /metrics, no secrets
    kubernetes:
      # Every job pod starts "restricted": a plain user, no capabilities, no service account token, no credentials.
      # That's all a job on any label but `sindri` gets (tests and checks run the PR's code - nothing to steal).
      # A $services container is merged with the same.
      pod_template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ .Values.app }}-build-job
            {{- include "sindri-build.meruLabels" . | nindent 12 }}
        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: job
              # Every job pays its buildCost out of the node's build budget (RAM, disk, CPU pools: cm-jnxa), whichever app it
              # is for, and waits as Pending until all three fit. The `sindri` label below keeps this: the runner merges
              # templates key by key.
              resources:
                {{- toYaml (merge (dict "limits" (dict "clockmost.com/build-memory" (include "sindri-build.costMemory" . | int) "clockmost.com/build-disk" (include "sindri-build.costDisk" . | int) "clockmost.com/build-cpu" (include "sindri-build.costCpu" . | int))) .Values.jobResources) | nindent 16 }}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
            - name: $services
              resources:
                {{- toYaml .Values.serviceResources | nindent 16 }}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
      {{- if .Values.build }}
      # Jobs on the `sindri` label build the image: rootless BuildKit as uid 1000 with exactly what the build spike
      # needed (clockmost-kubernetes.md step 2c) - SELinux container_engine_t, the meru/build.json seccomp profile
      # (installed on every node), SETUID/SETGID for newuidmap. They run as `signer` with a 10-minute token meant only
      # for OpenBao, which they trade for the app's Zot login and signing key, kept in memory (/keys). Only these
      # jobs get that token.
      pod_templates:
        # `sindri` jobs build images (rootless BuildKit needs the setuid helpers and Meru's build seccomp profile).
        # They carry no identity and no keys: releasing - push, sign, deploy - is meru-release's (Meru/meru-release),
        # in a pod spec no workflow can change. A workflow edited in a pull request has nothing to reach for.
        sindri:
          spec:
            securityContext:
              seLinuxOptions:
                type: container_engine_t
              seccompProfile:
                type: Localhost
                localhostProfile: meru/build.json
            containers:
              - name: job
                env:
                  - name: BUILDKITD_FLAGS
                    value: --oci-worker-no-process-sandbox
                resources:
                  limits:
                    memory: {{ .Values.buildMemoryLimit }}
                    {{- if .Values.buildCost.enforceDisk }}
                    ephemeral-storage: {{ include "sindri-build.diskLimit" . }}Gi # kubelet evicts only this pod above it
                    {{- end }}
                securityContext:
                  allowPrivilegeEscalation: true # newuidmap/newgidmap are setuid
                  capabilities:
                    drop: [ALL]
                    add: [SETUID, SETGID]
      {{- end }}
{{- if .Values.build }}
---
# OpenBao's CA, for meru-release's release Jobs (their key fetch runs as `signer` in this namespace).
apiVersion: v1
kind: ConfigMap
metadata:
  name: openbao-ca
  namespace: {{ include "sindri-build.namespace" . }}
  labels:
    {{- include "sindri-build.labels" . | nindent 4 }}
data:
  ca.pem: |
    {{- .Values.openbao.caCert | nindent 4 }}
{{- end }}
