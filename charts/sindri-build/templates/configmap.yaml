# gitea/runner config (example: internal/pkg/config/config.example.yaml of the pinned release).
apiVersion: v1
kind: ConfigMap
metadata:
  name: sindri-config
  namespace: {{ include "sindri-build.namespace" . }}
  labels:
    {{- include "sindri-build.labels" . | nindent 4 }}
data:
  config.yaml: |
    log:
      level: info
    runner:
      file: /data/.runner
      capacity: 1 # one job at a time
      timeout: {{ .Values.runner.timeout }}
    cache:
      enabled: false # actions/cache server; our jobs don't use it (and it wanted a writable /.cache)
    metrics:
      enabled: true
      addr: ":9101" # /healthz + /readyz for the probes; /metrics, no secrets
    kubernetes:
      # Every job pod starts "restricted": a plain user, no capabilities, no service account token, no credentials.
      # That's all a job on any label but `sindri` gets (tests and checks run the PR's code - nothing to steal).
      # A $services container is merged with the same.
      pod_template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ .Values.app }}-build-job
            {{- include "sindri-build.meruLabels" . | nindent 12 }}
        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: job
              # Every job takes one of the node's `build-slot`s, whichever app it is for, so the third job at once waits
              # as Pending. The `sindri` label below keeps this: the runner merges templates key by key.
              resources:
                {{- toYaml (merge (dict "limits" (dict "clockmost.com/build-slot" "1")) .Values.jobResources) | nindent 16 }}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
            - name: $services
              resources:
                {{- toYaml .Values.serviceResources | nindent 16 }}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
      # Jobs on the `sindri` label build the image: rootless BuildKit as uid 1000 with exactly what the build spike
      # needed (clockmost-kubernetes.md step 2c) - SELinux container_engine_t, the meru/build.json seccomp profile
      # (installed on every node), SETUID/SETGID for newuidmap. They run as `signer` with a 10-minute token meant only
      # for OpenBao, which they trade for the app's Zot login and signing key, kept in memory (/keys). Only these
      # jobs get that token.
      pod_templates:
        sindri:
          spec:
            serviceAccountName: signer
            securityContext:
              seLinuxOptions:
                type: container_engine_t
              seccompProfile:
                type: Localhost
                localhostProfile: meru/build.json
            containers:
              - name: job
                env:
                  - name: BUILDKITD_FLAGS
                    value: --oci-worker-no-process-sandbox
                  - name: DOCKER_CONFIG # buildctl + cosign log in to zot.clockmost.com as <app>-builder
                    value: /keys/zot
                  - name: BAO_ADDR
                    value: {{ .Values.openbao.addr }}
                  - name: BAO_CACERT
                    value: /etc/openbao/ca.pem
                  - name: BAO_ROLE
                    value: meru-build # shared (D71): reads the caller's own namespace's keys only
                  - name: BAO_KEYS_PATH # KV v2 under the apps mount
                    value: apps/data/meru/{{ include "sindri-build.namespace" . }}/build
                  - name: BAO_JWT_FILE
                    value: /var/run/secrets/openbao/token
                resources:
                  limits:
                    memory: {{ .Values.buildMemoryLimit }}
                securityContext:
                  allowPrivilegeEscalation: true # newuidmap/newgidmap are setuid
                  capabilities:
                    drop: [ALL]
                    add: [SETUID, SETGID]
                volumeMounts:
                  - name: openbao-token
                    mountPath: /var/run/secrets/openbao
                    readOnly: true
                  - name: openbao-ca
                    mountPath: /etc/openbao
                    readOnly: true
                  - name: keys
                    mountPath: /keys
            volumes:
              - name: openbao-token
                projected:
                  sources:
                    - serviceAccountToken:
                        audience: openbao
                        expirationSeconds: 600
                        path: token
              - name: openbao-ca
                configMap:
                  name: openbao-ca
              - name: keys
                emptyDir:
                  medium: Memory
                  sizeLimit: 1Mi
---
# OpenBao's CA, for the `sindri` jobs' key fetch.
apiVersion: v1
kind: ConfigMap
metadata:
  name: openbao-ca
  namespace: {{ include "sindri-build.namespace" . }}
  labels:
    {{- include "sindri-build.labels" . | nindent 4 }}
data:
  ca.pem: |
    {{- .Values.openbao.caCert | nindent 4 }}
